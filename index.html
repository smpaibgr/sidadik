<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDaDik - Sistem Informasi Data Pendidikan</title>
    <!-- Favicon / Ikon Tab Browser -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3074/3074069.png" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: sans-serif;
        }
        
        /* Styling untuk Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Tampilan Loading sementara (sebelum iframe termuat sepenuhnya) */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1; /* Berada di belakang iframe */
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb; /* Warna brand biru SIDaDik */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- Tampilan Pengalihan (Redirect) -->
    <div class="loading-screen">
        <div class="spinner"></div>
        <div style="color: #64748b; font-size: 16px; font-weight: bold; margin-bottom: 8px;">Memuat SIDaDik...</div>
        <div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 0 20px;">
            Sistem pengamanan sedang menyambungkan Anda.<br>
            Jika tidak berpindah otomatis dalam 3 detik, <a href="https://script.google.com/macros/s/AKfycbwBS4WyDUm5eRy7DHGxm-xiT1qPB-O1rv7KNGCocBma4FnVJ1BWOiuKcU-h8eg3Npe0pA/exec?authuser=0" style="color: #2563eb; text-decoration: underline;">klik di sini</a>.
        </div>
    </div>

    <script>
        // Mengalihkan pengguna dari iframe ke URL asli agar kebal dari pemblokiran browser HP
        setTimeout(function() {
            window.location.replace("https://script.google.com/macros/s/AKfycbwBS4WyDUm5eRy7DHGxm-xiT1qPB-O1rv7KNGCocBma4FnVJ1BWOiuKcU-h8eg3Npe0pA/exec?authuser=0");
        }, 1000);
    </script>
</body>
</html>
