<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDaDik - Sistem Informasi Data Pendidikan</title>
    <!-- Favicon / Ikon Tab Browser -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3074/3074069.png" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: sans-serif;
        }
        
        /* Styling untuk Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Tampilan Loading sementara (sebelum iframe termuat sepenuhnya) */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1; /* Berada di belakang iframe */
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb; /* Warna brand biru SIDaDik */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- Animasi Loading -->
    <div class="loading-screen">
        <div class="spinner"></div>
        <div style="color: #64748b; font-size: 14px;">Memuat SIDaDik...</div>
    </div>

    <!-- Menggunakan Iframe agar domain tetap GitHub -->
    <iframe src="https://script.google.com/macros/s/AKfycbxdzHn0V_eIS8VCIRfsUzhv74jBJvxgTYA-QA_Ya57OMmlO7TUOg1uWO6TrdHYYcva8/exec" title="SIDaDik App" allow="camera; microphone; fullscreen" onload="document.querySelector('.loading-screen').style.display='none'"></iframe>

</body>
</html>
